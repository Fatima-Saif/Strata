<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Mockup Showcase</title>
<style>
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    /* Beautiful blue gradient like your example */
    background: linear-gradient(135deg, #0a84ff, #005bb5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    overflow: hidden;
  }
  .showcase-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    transform-style: preserve-3d;
    perspective: 1200px;
    margin-top: -2rem;
  }
  /* Shared screen styles */
  .screen {
    background-color: #fff;
    background-size: 100% auto;
    background-position: top center;
    background-repeat: no-repeat;
    box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.6);
  }
  
  /* Tablet / iPad */
  .device-tablet {
    width: 380px;
    height: 520px;
    border: 16px solid #1c1c1e;
    border-radius: 24px;
    /* 3D Rotation */
    transform: rotateY(18deg) translateZ(-120px) translateX(60px);
    background-image: url('screenshot-tablet.png');
  }

  /* Laptop / MacBook */
  .device-laptop-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateZ(80px);
    z-index: 10;
  }
  .device-laptop {
    width: 800px;
    height: 500px;
    border: 16px solid #1c1c1e;
    border-bottom-width: 24px;
    border-radius: 16px 16px 0 0;
    background-image: url('screenshot-desktop.png');
    position: relative;
  }
  /* MacBook base/keyboard lip */
  .laptop-base {
    width: 960px;
    height: 18px;
    background: #e5e5ea;
    border-radius: 0 0 20px 20px;
    box-shadow: inset 0 -4px 10px rgba(0,0,0,0.15), 0 25px 50px rgba(0,0,0,0.5);
    position: relative;
  }
  .laptop-notch {
    width: 140px;
    height: 8px;
    background: #c7c7cc;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 0 0 8px 8px;
  }

  /* Mobile / iPhone */
  .device-mobile {
    width: 220px;
    height: 460px;
    border: 12px solid #1c1c1e;
    border-radius: 36px;
    /* 3D Rotation */
    transform: rotateY(-18deg) translateZ(-100px) translateX(-60px);
    background-image: url('screenshot-mobile.png');
    position: relative;
  }
  /* iPhone Dynamic Island / Notch */
  .mobile-notch {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 22px;
    background: #1c1c1e;
    border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="showcase-container">
    <!-- Left: Tablet -->
    <div class="screen device-tablet"></div>
    
    <!-- Center: Laptop -->
    <div class="device-laptop-wrapper">
      <div class="screen device-laptop"></div>
      <div class="laptop-base">
        <div class="laptop-notch"></div>
      </div>
    </div>

    <!-- Right: Mobile -->
    <div class="screen device-mobile">
      <div class="mobile-notch"></div>
    </div>
  </div>
</body>
</html>
