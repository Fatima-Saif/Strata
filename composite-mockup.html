<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fitted Mockup on Uploaded Image</title>
<style>
  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    position: relative;
    /* Approximate size of the uploaded image to maintain aspect ratio */
    width: 1000px;
    height: 1000px;
    background: url('file:///C:/Users/HP/.gemini/antigravity/brain/39d73ace-01b7-4d8a-94ef-0139c6f6ae07/.user_uploaded/media_1787295931947.png') no-repeat center center;
    background-size: contain;
    transform-style: preserve-3d;
    perspective: 1500px;
  }
  .screen {
    position: absolute;
    background-size: 100% auto;
    background-position: top center;
    background-repeat: no-repeat;
    background-color: #fff;
    /* Slight opacity to blend with the original screen's lighting */
    opacity: 0.95;
    border-radius: 6px; 
  }
  
  /* Approximations based on the 5-screen layout in the uploaded image */
  
  /* Laptop Center */
  .laptop {
    width: 420px; height: 260px;
    top: 360px; left: 290px;
    transform: rotateX(5deg) rotateY(0deg) rotateZ(0deg);
    background-image: url('screenshot-desktop-templates.png');
  }
  
  /* Phone Left */
  .phone-left {
    width: 90px; height: 180px;
    top: 425px; left: 165px;
    transform: rotateX(5deg) rotateY(15deg) rotateZ(3deg);
    background-image: url('screenshot-mobile-templates.png');
    border-radius: 12px;
  }
  
  /* Phone Right */
  .phone-right {
    width: 105px; height: 215px;
    top: 400px; left: 755px;
    transform: rotateX(5deg) rotateY(-15deg) rotateZ(-2deg);
    background-image: url('screenshot-mobile-templates.png');
    border-radius: 12px;
  }
  
  /* Monitor Back Left */
  .monitor-left {
    width: 320px; height: 200px;
    top: 175px; left: 100px;
    transform: rotateX(0deg) rotateY(10deg) rotateZ(1deg);
    background-image: url('screenshot-desktop-templates.png');
  }
  
  /* Monitor Back Right */
  .monitor-right {
    width: 440px; height: 260px;
    top: 120px; left: 510px;
    transform: rotateX(0deg) rotateY(-10deg) rotateZ(-1deg);
    background-image: url('screenshot-desktop-templates.png');
  }
</style>
</head>
<body>
  <div class="container">
    <!-- Overlaying the screens -->
    <div class="screen monitor-left"></div>
    <div class="screen monitor-right"></div>
    <div class="screen laptop"></div>
    <div class="screen phone-left"></div>
    <div class="screen phone-right"></div>
  </div>
</body>
</html>
